name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Opt into Node.js 24 for all pinned JavaScript actions. GitHub's deprecating Node 20 on Sep
# 16 2026; before then the runner emits a warning on every run against actions still targeting
# 20. This env var flips those actions to the new runtime without having to chase version
# bumps across three third-party actions. Remove once Node 24 is the runner default.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Determine version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore XperienceCommunity.Sentinel.slnx

      - name: Build
        run: dotnet build XperienceCommunity.Sentinel.slnx --configuration Release --no-restore -p:Version=${{ steps.ver.outputs.version }}

      - name: Test
        run: dotnet test XperienceCommunity.Sentinel.slnx --configuration Release --no-build --verbosity minimal

      - name: Pack Core library
        run: dotnet pack src/XperienceCommunity.Sentinel.Core/XperienceCommunity.Sentinel.Core.csproj --configuration Release --no-build -p:Version=${{ steps.ver.outputs.version }} --output ./artifacts

      - name: Pack XbyK integration
        run: dotnet pack src/XperienceCommunity.Sentinel.Module/XperienceCommunity.Sentinel.Module.csproj --configuration Release --no-build -p:Version=${{ steps.ver.outputs.version }} --output ./artifacts

      - name: Pack XbyK Admin UI
        run: dotnet pack src/XperienceCommunity.Sentinel.Admin/XperienceCommunity.Sentinel.Admin.csproj --configuration Release --no-build -p:Version=${{ steps.ver.outputs.version }} --output ./artifacts

      - name: Pack CLI tool
        run: dotnet pack src/XperienceCommunity.Sentinel/XperienceCommunity.Sentinel.csproj --configuration Release --no-build -p:Version=${{ steps.ver.outputs.version }} --output ./artifacts

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY secret is not set."
            exit 1
          fi
          dotnet nuget push "./artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: ./artifacts/*.nupkg
